name: CS2 Companion Studio quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cs2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: API / security / unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pytest
      - name: Check secrets and Python syntax
        run: |
          python scripts/check_secrets.py
          python -m compileall -q app.py dashboard_delivery.py security.py gsi_lifecycle.py profile_store.py support_diagnostics.py scripts tests
      - name: Run all existing regression suites
        shell: bash
        run: |
          set -e
          for t in test_economy test_timer test_studio test_security test_lifecycle test_profiles_and_diagnostics; do python -m "tests.standalone.$t"; done
      - name: Test public security contract
        run: python -m pytest -q tests/test_public_security.py tests/test_secret_hygiene.py tests/test_public_docs.py tests/test_release_version.py tests/test_code_quality.py tests/test_profile_recovery.py tests/test_dashboard_delivery.py
      - name: Check JavaScript syntax
        if: runner.os == 'Linux'
        run: |
          node tests/test_profile_sync.js
          node --check static/profile-sync.js
          node --check static/widgets.js
          node --check static/studio.js
          node --check static/i18n.js
          node --check static/experience.js

  windows-installer:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse all installer scripts
        shell: powershell
        run: |
          Get-ChildItem installer -Filter '*.ps1' | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($_.Name + ': ' + ($errors | Out-String)) }
          }
      - name: Installer helper tests (no UAC/CS2)
        shell: powershell
        run: .\installer\test_helpers.ps1

  browsers:
    name: Real browser + WebSocket (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Browser and Linux libraries are baked into this version-pinned image.
    # Avoid "playwright install --with-deps" downloading 100+ Ubuntu packages
    # from intermittently slow mirrors on every CI run.
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Install backend and matching Playwright Python package
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt playwright==1.57.0
      - name: Run desktop + mobile functional journey against real server
        # Actions mounts /github/home owned by pwuser, but the container runs
        # as root. Firefox refuses that HOME ownership mismatch at launch.
        env:
          HOME: /root
        run: python tests/test_live_browser.py --browser ${{ matrix.browser }}

  dependency-audit:
    name: Vulnerability report / SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency auditor
        run: python -m pip install pip-audit
      - name: Audit runtime dependencies (failure blocks release)
        run: |
          mkdir -p audit
          python -m pip_audit -r requirements.txt -f json -o audit/dependencies.json
      - name: Generate CycloneDX SBOM
        if: success()
        run: python -m pip_audit -r requirements.txt -f cyclonedx-json -o audit/sbom.cdx.json
      - name: Preserve audit reports for maintainers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit/
          if-no-files-found: ignore
          retention-days: 14

  docker-smoke:
    name: Docker build / startup / isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate CI-only credentials (never print them)
        shell: bash
        run: |
          mkdir -p data logs
          sudo chown -R 10001:10001 data logs
          python - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe
          Path('.env').write_text('GSI_TOKEN='+token_urlsafe(24)+'\nDASHBOARD_PIN='+token_urlsafe(12)+'\nBOMB_TIMER_ENABLED=false\n', encoding='utf-8')
          PY
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Check HTTP and GSI with a synthetic payload
        run: python scripts/docker_smoke.py
      - name: Verify profiles persist on container restart
        run: |
          test -s data/profiles.json
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          python scripts/docker_smoke.py
          test -s data/profiles.json
      - name: Verify unprivileged container
        run: test "$(docker compose exec -T cs2-companion-studio id -u)" = '10001'
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
