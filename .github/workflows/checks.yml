name: CS2 Companion Studio quality gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cs2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    name: API / security / unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt pytest
      - name: Check secrets and Python syntax
        run: |
          python scripts/check_secrets.py
          python -m compileall -q companion scripts tests
      - name: Check tracked source archive privacy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archivePath="$RUNNER_TEMP/cs2-source-check.zip"
          git archive --format=zip --output="$archivePath" HEAD
          python scripts/check_public_archive.py "$archivePath"
      - name: Run all existing regression suites
        shell: bash
        run: |
          set -e
          for t in test_economy test_timer test_studio test_security test_lifecycle test_profiles_and_diagnostics; do python -m "tests.standalone.$t"; done
      - name: Test public security contract
        run: python -m pytest -q tests/unit tests/integration tests/contracts
      - name: Check JavaScript syntax
        if: runner.os == 'Linux'
        run: |
          node tests/js/test_profile_sync.js
          node tests/js/test_reconnect.js
          node tests/js/test_i18n.js
          node tests/js/test_display_format.js
          node tests/js/test_dashboard_client.js
          node tests/js/test_theme_preview.js
          node tests/js/test_drafts.js
          node tests/js/test_profile_publication.js
          node --check static/js/draft-publications.js
          node --check static/js/published-profiles.js
          node --check static/js/profile-publication.js
          node --check static/js/draft-schema.js
          node --check static/js/draft-contract.js
          node --check static/js/edit-history.js
          node --check static/js/draft-store.js
          node --check static/js/draft-session.js
          node --check static/js/theme-preview.js
          node --check static/js/display-format.js
          node --check static/js/widget-renderer.js
          node --check static/js/dashboard-client.js
          node --check static/js/reconnect.js
          node --check static/js/profile-sync.js
          node --check static/js/widgets.js
          node --check static/js/studio.js
          node --check static/js/i18n.js
          node --check static/js/experience.js

  windows-installer:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse all installer scripts
        shell: powershell
        run: .\tests\windows\check_syntax.ps1
      - name: Installer helper tests (no UAC/CS2)
        shell: powershell
        run: .\tests\windows\test_helpers.ps1

  browsers:
    name: Real browser + WebSocket (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # Browser and Linux libraries are baked into this version-pinned image.
    # Avoid "playwright install --with-deps" downloading 100+ Ubuntu packages
    # from intermittently slow mirrors on every CI run.
    container:
      image: mcr.microsoft.com/playwright/python:v1.57.0-noble@sha256:3de745b23fc4b33fccbcb3f592ee52dd5c80ce79f19f839c825ce23364e403c1
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install backend and matching Playwright Python package
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt playwright==1.57.0
      - name: Run desktop + mobile functional journey against real server
        # Actions mounts /github/home owned by pwuser, but the container runs
        # as root. Firefox refuses that HOME ownership mismatch at launch.
        env:
          HOME: /root
        run: python tests/browser/test_live_browser.py --browser ${{ matrix.browser }}

      - name: Characterize all widgets with frozen synthetic fixtures
        env:
          HOME: /root
        run: python tests/browser/test_widget_characterization.py --browser ${{ matrix.browser }}

      - name: Verify all themes, local fonts and profile isolation
        env:
          HOME: /root
        run: python tests/browser/test_themes.py --browser ${{ matrix.browser }}

      - name: Verify persistent IndexedDB drafts, history and tab conflicts
        env:
          HOME: /root
        run: python tests/browser/test_drafts.py --browser ${{ matrix.browser }}

      - name: Verify explicit publication, retries and conflict resolution
        env:
          HOME: /root
        run: python tests/browser/test_profile_publication.py --browser ${{ matrix.browser }}

  dependency-audit:
    name: Vulnerability report / SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit runtime dependencies (failure blocks release)
        run: |
          mkdir -p audit
          python -m pip_audit -r requirements.txt -f json -o audit/dependencies.json
      - name: Generate CycloneDX SBOM
        if: success()
        run: python -m pip_audit -r requirements.txt -f cyclonedx-json -o audit/sbom.cdx.json
      - name: Preserve audit reports for maintainers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit
          path: audit/
          if-no-files-found: ignore
          retention-days: 14

  docker-smoke:
    name: Docker build / startup / isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Generate CI-only credentials (never print them)
        shell: bash
        run: |
          mkdir -p data logs
          sudo chown -R 10001:10001 data logs
          python - <<'PY'
          from pathlib import Path
          from secrets import token_urlsafe
          Path('.env').write_text('GSI_TOKEN='+token_urlsafe(24)+'\nDASHBOARD_PIN='+token_urlsafe(12)+'\nBOMB_TIMER_ENABLED=false\n', encoding='utf-8')
          PY
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 120
      - name: Verify offline recovery command packaging
        run: docker compose exec -T cs2-companion-studio python scripts/recover_profiles.py --help
      - name: Check HTTP and GSI with a synthetic payload
        run: python tests/docker/smoke.py
      - name: Verify profiles persist on container restart
        run: |
          test -s data/profiles.json
          docker compose restart
          docker compose up -d --wait --wait-timeout 120
          python tests/docker/smoke.py
          test -s data/profiles.json
      - name: Verify settings reload without rebuilding the image
        run: python tests/docker/settings.py
      - name: Verify packaged profile contracts and isolated recovery
        run: python tests/docker/profile_contracts.py
      - name: Verify packaged inactive publication service and assets
        run: python tests/docker/profile_publication.py
      - name: Verify unprivileged container
        run: test "$(docker compose exec -T cs2-companion-studio id -u)" = '10001'
      - name: Cleanup
        if: always()
        run: docker compose down --remove-orphans
